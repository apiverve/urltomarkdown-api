openapi: 3.0.4
info:
  title: URL to Markdown
  description: >-
    URL to Markdown converts any webpage URL into structured Markdown text. Each
    response delivers the page title, converted text, word count, and element
    counts, with paid plans adding optional link and image syntax.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/urltomarkdown:
    post:
      summary: URL to Markdown
      description: Convert a webpage URL to Markdown format
      operationId: urltomarkdown
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: https://example.com/
                  title: Example Domain
                  markdown: >-
                    # Example Domain



                    This domain is for use in documentation examples without
                    needing permission. Avoid use in operations.



                    [Learn more](https://iana.org/domains/example)
                  wordCount: 20
                  imageCount: 0
                  linkCount: 1
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the webpage to convert to Markdown
                includeImages:
                  type: boolean
                  description: Whether to include image references in the Markdown output
                includeLinks:
                  type: boolean
                  description: Whether to include hyperlinks in the Markdown output
              required:
                - url
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  url: https://example.com/
  includeImages: true
  includeLinks: true
